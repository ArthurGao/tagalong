services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tagalong
      POSTGRES_PASSWORD: tagalong
      POSTGRES_DB: tagalong
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:
